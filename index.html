<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jsQR スキャナー</title>
    <!-- 1. CDNからjsQRライブラリを確実に読み込む -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            text-align: center;
            font-family: sans-serif;
        }

        /* 重ね合わせの親要素 */
        #wrapper {
            position: relative;
            width: 320px;  /* スマホで見やすい幅に変更 */
            height: 240px;
            margin: 0 auto;
        }

        /* 非表示にする生ビデオ */
        #video {
            position: absolute;
            top: 0px;
            left: 0px;
            visibility: hidden;
        }

        /* 映像描画用キャンバス */
        #camera-canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 50;
        }

        /* 赤枠描画用キャンバス */
        #rect-canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 100;
        }

        /* 結果メッセージ表示欄 (相対配置に変更して画面崩れを防止) */
        #qr-msg {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>QRコードスキャナー (jsQR)</h2>

    <!-- 重ね合わせる要素 -->
    <div id="wrapper">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="camera-canvas"></canvas>
        <canvas id="rect-canvas"></canvas>
    </div>

    <!-- 結果表示用 -->
    <div id="qr-msg">QRコード: 見つかりません</div>

    <script>
        const video = document.getElementById('video');
        const cvs = document.getElementById('camera-canvas');
        const ctx = cvs.getContext('2d');
        const rectCvs = document.getElementById('rect-canvas');
        const rectCtx = rectCvs.getContext('2d');

        let contentWidth;
        let contentHeight;

        // Webカメラの起動
        navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: "environment" } })
            .then((stream) => {
                video.srcObject = stream;
                video.onloadeddata = () => {
                    video.play();
                    contentWidth = video.videoWidth || 640;
                    contentHeight = video.videoHeight || 480;

                    // キャンバスサイズの初期化
                    cvs.width = contentWidth;
                    cvs.height = contentHeight;
                    rectCvs.width = contentWidth;
                    rectCvs.height = contentHeight;

                    canvasUpdate();
                    checkImage();
                }
            })
            .catch((e) => {
                console.error("カメラの起動エラー:", e);
                document.getElementById('qr-msg').textContent = "カメラを起動できませんでした";
            });

        // カメラ映像をキャンバスに描画し続ける
        const canvasUpdate = () => {
            ctx.drawImage(video, 0, 0, contentWidth, contentHeight);
            requestAnimationFrame(canvasUpdate);
        }

        // QRコードの検出処理
        const checkImage = () => {
            if (contentWidth && contentHeight) {
                // キャンバスから画像データを取得
                const imageData = ctx.getImageData(0, 0, contentWidth, contentHeight);
                // jsQRで解析
                const code = jsQR(imageData.data, contentWidth, contentHeight);

                // 前回の赤枠を消去
                rectCtx.clearRect(0, 0, contentWidth, contentHeight);

                if (code) {
                    console.log("QRcodeが見つかりました", code.data);
                    drawRect(code.location);
                    document.getElementById('qr-msg').textContent = `QRコード: ${code.data}`;
                } else {
                    document.getElementById('qr-msg').textContent = `QRコード: 見つかりません`;
                }
            }
            // 0.2秒ごとに再チェック
            setTimeout(() => { checkImage() }, 200);
        }

        // 赤枠の描画処理
        const drawRect = (location) => {
            drawLine(location.topLeftCorner, location.topRightCorner);
            drawLine(location.topRightCorner, location.bottomRightCorner);
            drawLine(location.bottomRightCorner, location.bottomLeftCorner);
            drawLine(location.bottomLeftCorner, location.topLeftCorner);
        }

        // 線の描画補助
        const drawLine = (begin, end) => {
            rectCtx.lineWidth = 4;
            rectCtx.strokeStyle = "#F00";
            rectCtx.beginPath();
            rectCtx.moveTo(begin.x, begin.y);
            rectCtx.lineTo(end.x, end.y);
            rectCtx.stroke();
        }
    </script>
</body>
</html>
