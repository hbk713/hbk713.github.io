<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jsQR スキャナー</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            text-align: center;
            font-family: sans-serif;
        }

        #wrapper {
            position: relative;
            width: 320px;
            height: 240px;
            margin: 0 auto;
        }

        #video {
            position: absolute;
            top: 0px;
            left: 0px;
            visibility: hidden;
        }

        #camera-canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 50;
        }

        #rect-canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 100;
        }

        #qr-msg {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>QRコードスキャナー (jsQR)</h2>

    <div id="wrapper">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="camera-canvas"></canvas>
        <canvas id="rect-canvas"></canvas>
    </div>

    <div id="qr-msg">QRコード: 見つかりません</div>

    <script>
        const video = document.getElementById('video');
        const cvs = document.getElementById('camera-canvas');
        const ctx = cvs.getContext('2d');
        const rectCvs = document.getElementById('rect-canvas');
        const rectCtx = rectCvs.getContext('2d');

        let contentWidth;
        let contentHeight;

        // 枠表示のタイマー管理用変数
        let clearRectTimer = null;

        navigator.mediaDevices.getUserMedia({ 
            audio: false, 
            video: { 
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            } 
        })
        .then((stream) => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                contentWidth = video.videoWidth || 640;
                contentHeight = video.videoHeight || 480;

                cvs.width = contentWidth;
                cvs.height = contentHeight;
                rectCvs.width = contentWidth;
                rectCvs.height = contentHeight;

                canvasUpdate();
                checkImage();
            }
        })
        .catch((e) => {
            console.error("カメラの起動エラー:", e);
            document.getElementById('qr-msg').textContent = "カメラを起動できませんでした";
        });

        const canvasUpdate = () => {
            ctx.drawImage(video, 0, 0, contentWidth, contentHeight);
            requestAnimationFrame(canvasUpdate);
        }

        const checkImage = () => {
            if (contentWidth && contentHeight && video.readyState === video.HAVE_ENOUGH_DATA) {
                const imageData = ctx.getImageData(0, 0, contentWidth, contentHeight);
                const code = jsQR(imageData.data, contentWidth, contentHeight, {
                    inversionAttempts: "dontInvert"
                });

                if (code) {
                    console.log("QRcodeが見つかりました", code.data);
                    
                    // 赤枠を描画
                    drawRect(code.location);
                    document.getElementById('qr-msg').textContent = `QRコード: ${code.data}`;

                    // 既にセットされている消去タイマーがあればリセット
                    if (clearRectTimer) clearTimeout(clearRectTimer);

                    // 1秒間（1000ms）カメラから見失っても赤枠を残す
                    clearRectTimer = setTimeout(() => {
                        rectCtx.clearRect(0, 0, contentWidth, contentHeight);
                        document.getElementById('qr-msg').textContent = `QRコード: 見つかりません`;
                    }, 1000);

                    // ★ここに将来ラズパイへの送信処理（sendToRaspberryPi(code.data) など）を追加できます
                }
            }
            setTimeout(() => { checkImage() }, 100);
        }

        const drawRect = (location) => {
            // 新しい枠を描く前にキャンバスを一旦クリア
            rectCtx.clearRect(0, 0, contentWidth, contentHeight);
            
            drawLine(location.topLeftCorner, location.topRightCorner);
            drawLine(location.topRightCorner, location.bottomRightCorner);
            drawLine(location.bottomRightCorner, location.bottomLeftCorner);
            drawLine(location.bottomLeftCorner, location.topLeftCorner);
        }

        const drawLine = (begin, end) => {
            rectCtx.lineWidth = 6; // 枠線を太くして見やすく変更
            rectCtx.strokeStyle = "#FF0000";
            rectCtx.beginPath();
            rectCtx.moveTo(begin.x, begin.y);
            rectCtx.lineTo(end.x, end.y);
            rectCtx.stroke();
        }
    </script>
</body>
</html>
