<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jsQR スキャナー</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            text-align: center;
            font-family: sans-serif;
        }

        #wrapper {
            position: relative;
            /* スマホ・タブレット・PCの各画面サイズに対応 */
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            margin: 0 auto;
        }

        #video {
            position: absolute;
            top: 0px;
            left: 0px;
            visibility: hidden;
        }

        #camera-canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 50;
        }

        #rect-canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 100;
        }

        #qr-msg {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>QRコードスキャナー (jsQR)</h2>

    <div id="wrapper">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="camera-canvas"></canvas>
        <canvas id="rect-canvas"></canvas>
    </div>

    <div id="qr-msg">QRコード: 見つかりません</div>

    <script>
        const video = document.getElementById('video');
        const cvs = document.getElementById('camera-canvas');
        const ctx = cvs.getContext('2d');
        const rectCvs = document.getElementById('rect-canvas');
        const rectCtx = rectCvs.getContext('2d');

        let contentWidth;
        let contentHeight;
        let clearRectTimer = null;

        // 連打送信防止用の変数
        let lastSentValue = "";
        let lastSentTime = 0;

        navigator.mediaDevices.getUserMedia({ 
            audio: false, 
            video: { 
                facingMode: "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            } 
        })
        .then((stream) => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                contentWidth = video.videoWidth || 640;
                contentHeight = video.videoHeight || 480;

                cvs.width = contentWidth;
                cvs.height = contentHeight;
                rectCvs.width = contentWidth;
                rectCvs.height = contentHeight;

                // カメラの映像サイズに合わせて枠のアスペクト比を動的に調整
                document.getElementById('wrapper').style.aspectRatio = `${contentWidth} / ${contentHeight}`;

                canvasUpdate();
                checkImage();
            }
        })
        .catch((e) => {
            console.error("カメラの起動エラー:", e);
            document.getElementById('qr-msg').textContent = "カメラを起動できませんでした";
        });

        // カメラ画像を左右反転して描画する処理
        const canvasUpdate = () => {
            ctx.save();
            ctx.translate(contentWidth, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, contentWidth, contentHeight);
            ctx.restore();

            requestAnimationFrame(canvasUpdate);
        }

        const checkImage = () => {
            if (contentWidth && contentHeight && video.readyState === video.HAVE_ENOUGH_DATA) {
                // すでに描画レベルで左右反転補正済みのピクセルデータを取得
                const imageData = ctx.getImageData(0, 0, contentWidth, contentHeight);
                
                const code = jsQR(imageData.data, contentWidth, contentHeight, {
                    inversionAttempts: "attemptBoth"
                });

                if (code) {
                    console.log("QRcodeが見つかりました", code.data);
                    
                    drawRect(code.location);
                    document.getElementById('qr-msg').textContent = `QRコード: ${code.data}`;

                    // --- ラズパイへのデータ送信処理 ---
                    const now = Date.now();
                    if (code.data !== lastSentValue || (now - lastSentTime) > 3000) {
                        lastSentValue = code.data;
                        lastSentTime = now;
                        sendToRaspberryPi(code.data);
                    }

                    if (clearRectTimer) clearTimeout(clearRectTimer);
                    clearRectTimer = setTimeout(() => {
                        rectCtx.clearRect(0, 0, contentWidth, contentHeight);
                        document.getElementById('qr-msg').textContent = `QRコード: 見つかりません`;
                    }, 1000);
                }
            }
            setTimeout(() => { checkImage() }, 100);
        }

        // Python（Flask）へデータを送信する関数
        function sendToRaspberryPi(qrValue) {
            fetch('/api/qr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ qr_value: qrValue })
            })
            .then(response => response.json())
            .then(data => {
                console.log('ラズパイからの応答:', data);
            })
            .catch(error => {
                console.error('送信エラー:', error);
            });
        }

        // 反転描画に合わせて赤枠のX座標も補正して描画
        const drawRect = (location) => {
            rectCtx.clearRect(0, 0, contentWidth, contentHeight);

            // X座標を反転させる補助関数
            const fixPoint = (pt) => ({ x: pt.x, y: pt.y });

            drawLine(fixPoint(location.topLeftCorner), fixPoint(location.topRightCorner));
            drawLine(fixPoint(location.topRightCorner), fixPoint(location.bottomRightCorner));
            drawLine(fixPoint(location.bottomRightCorner), fixPoint(location.bottomLeftCorner));
            drawLine(fixPoint(location.bottomLeftCorner), fixPoint(location.topLeftCorner));
        }

        const drawLine = (begin, end) => {
            rectCtx.lineWidth = 6;
            rectCtx.strokeStyle = "#FF0000";
            rectCtx.beginPath();
            rectCtx.moveTo(begin.x, begin.y);
            rectCtx.lineTo(end.x, end.y);
            rectCtx.stroke();
        }
    </script>
</body>
</html>
