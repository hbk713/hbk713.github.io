<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jsQR スキャナー (軽量版)</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 20px;
            text-align: center;
            font-family: sans-serif;
        }

        #wrapper {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            margin: 0 auto;
        }

        /* 画面表示だけを左右反転 */
        #camera-canvas, #rect-canvas {
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        #camera-canvas { z-index: 50; }
        #rect-canvas { z-index: 100; }

        #qr-msg {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h2>QRコードスキャナー (軽量版)</h2>

    <div id="wrapper">
        <!-- videoタグで直接映像を表示して負荷を削減 -->
        <video id="video" autoplay muted playsinline style="display:none;"></video>
        <canvas id="camera-canvas"></canvas>
        <canvas id="rect-canvas"></canvas>
    </div>

    <div id="qr-msg">QRコード: 見つかりません</div>

    <script>
        const video = document.getElementById('video');
        const cvs = document.getElementById('camera-canvas');
        const ctx = cvs.getContext('2d', { willReadFrequently: true }); // 高速化フラグ
        const rectCvs = document.getElementById('rect-canvas');
        const rectCtx = rectCvs.getContext('2d');

        let contentWidth = 640;
        let contentHeight = 480;
        let clearRectTimer = null;

        let lastSentValue = "";
        let lastSentTime = 0;

        // 解像度をあらかじめ低め(640x480)に設定してPCの負担を劇的に減らす
        navigator.mediaDevices.getUserMedia({ 
            audio: false, 
            video: { 
                facingMode: "environment",
                width: { ideal: 640 },
                height: { ideal: 480 }
            } 
        })
        .then((stream) => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                contentWidth = video.videoWidth || 640;
                contentHeight = video.videoHeight || 480;

                cvs.width = contentWidth;
                cvs.height = contentHeight;
                rectCvs.width = contentWidth;
                rectCvs.height = contentHeight;

                // 描画ルーチン開始
                renderLoop();
                // 解析ルーチン開始（間引き処理）
                setInterval(checkImage, 300); // 300ms（0.3秒）に1回だけ解析
            }
        })
        .catch((e) => {
            console.error("カメラエラー:", e);
            document.getElementById('qr-msg').textContent = "カメラを起動できませんでした";
        });

        // 映像描画（表示用）
        function renderLoop() {
            ctx.drawImage(video, 0, 0, contentWidth, contentHeight);
            requestAnimationFrame(renderLoop);
        }

        // QR解析（負荷軽減のためタイマー実行）
        function checkImage() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

            const imageData = ctx.getImageData(0, 0, contentWidth, contentHeight);
            
            // パラメータを最小限にして処理スピード最優先に
            const code = jsQR(imageData.data, contentWidth, contentHeight, {
                inversionAttempts: "dontInvert"
            });

            if (code) {
                console.log("QR検出:", code.data);
                drawRect(code.location);
                document.getElementById('qr-msg').textContent = `QRコード: ${code.data}`;

                const now = Date.now();
                if (code.data !== lastSentValue || (now - lastSentTime) > 3000) {
                    lastSentValue = code.data;
                    lastSentTime = now;
                    sendToRaspberryPi(code.data);
                }

                if (clearRectTimer) clearTimeout(clearRectTimer);
                clearRectTimer = setTimeout(() => {
                    rectCtx.clearRect(0, 0, contentWidth, contentHeight);
                    document.getElementById('qr-msg').textContent = `QRコード: 見つかりません`;
                }, 1000);
            }
        }

        function sendToRaspberryPi(qrValue) {
            fetch('/api/qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ qr_value: qrValue })
            })
            .then(res => res.json())
            .then(data => console.log('送信成功:', data))
            .catch(err => console.error('送信エラー:', err));
        }

        function drawRect(location) {
            rectCtx.clearRect(0, 0, contentWidth, contentHeight);
            drawLine(location.topLeftCorner, location.topRightCorner);
            drawLine(location.topRightCorner, location.bottomRightCorner);
            drawLine(location.bottomRightCorner, location.bottomLeftCorner);
            drawLine(location.bottomLeftCorner, location.topLeftCorner);
        }

        function drawLine(begin, end) {
            rectCtx.lineWidth = 6;
            rectCtx.strokeStyle = "#FF0000";
            rectCtx.beginPath();
            rectCtx.moveTo(begin.x, begin.y);
            rectCtx.lineTo(end.x, end.y);
            rectCtx.stroke();
        }
    </script>
</body>
</html>
