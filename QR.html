<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコードスキャナーテスト</title>
    <!-- QRコード解析ライブラリ -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { text-align: center; font-family: sans-serif; padding: 20px; background-color: #f5f5f5; }
        #reader { width: 100%; max-width: 350px; margin: 0 auto; background: white; border-radius: 8px; padding: 10px; }
        #result-box { margin-top: 20px; padding: 15px; background: #e3f2fd; border-radius: 8px; display: inline-block; min-width: 250px; }
        .label { font-size: 14px; color: #555; }
        .value { font-size: 20px; font-weight: bold; color: #1565c0; word-break: break-all; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>📱 QRコードスキャナー</h2>
    <p>カメラ枠の中にQRコードをかざしてください</p>
    
    <!-- カメラ映像枠 -->
    <div id="reader"></div>
    
    <!-- 読み取り結果の表示エリア -->
    <div id="result-box">
        <div class="label">読み取り結果：</div>
        <div id="result" class="value">（まだ読み取っていません）</div>
    </div>

    <script>
        // QRコードの読み取りに成功したときの処理
        function onScanSuccess(decodedText, decodedResult) {
            // 画面の「読み取り結果」の文字を書き換える
            document.getElementById('result').innerText = decodedText;
        }

        // カメラの初期設定と起動
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { 
                fps: 10,                 // 1秒間のスキャン回数
                qrbox: { width: 220, height: 220 } // スキャン枠のサイズ
            },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
